<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Inducción - INFIBAGUÉ</title>

    <!-- React & ReactDOM (Versión de Producción para estabilidad) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel para interpretar JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Sistema de Progreso -->
    <script src="../js/progress.js"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabaseClient.js"></script>

    <!-- Tailwind CSS para estilos -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuración de Colores Institucionales -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        infi: {
                            blue: '#004A98',      // Azul institucional
                            lightBlue: '#00AEEF',
                            green: '#8BC53F',
                            yellow: '#FDB913',
                            orange: '#F7941D',
                            purple: '#662D91',
                            pink: '#EC008C',
                            gray: '#F2F2F2'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: url('../assets/atenci.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.90);
            pointer-events: none;
            z-index: -1;
        }

        /* Animaciones suaves */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        .slide-up {
            animation: slideUp 0.5s ease-out;
        }

        .slide-left {
            animation: slideLeft 0.5s ease-out;
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideLeft {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            50% {
                transform: scale(1.05);
            }

            70% {
                transform: scale(0.9);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .cursor-pointer {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONOS SVG INTEGRADOS ---
        const Icon = ({ children, className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const UsersIcon = (p) => <Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></Icon>;
        const LayersIcon = (p) => <Icon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></Icon>;
        const ActivityIcon = (p) => <Icon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></Icon>;
        const StarIcon = (p) => <Icon {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></Icon>;
        const PuzzleIcon = (p) => <Icon {...p}><path d="M20.5 11H22a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1.5" /><path d="M8 22V20.5a2.5 2.5 0 0 1 5 0V22" /><path d="M2 13v-2a2 2 0 0 1 2-2h1.5" /><path d="M13 2a2.5 2.5 0 0 1 0 5H11" /><rect x="2" y="6" width="18" height="14" rx="2" /></Icon>;
        const PlayIcon = (p) => <Icon {...p}><polygon points="5 3 19 12 5 21 5 3" /></Icon>;
        const CheckIcon = (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></Icon>;
        const XIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><line x1="15" y1="9" x2="9" y2="15" /><line x1="9" y1="9" x2="15" y2="15" /></Icon>;
        const TrophyIcon = (p) => <Icon {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></Icon>;
        const BookIcon = (p) => <Icon {...p}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></Icon>;
        const TargetIcon = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" /></Icon>;
        const EyeIcon = (p) => <Icon {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></Icon>;
        const ClipboardCheckIcon = (p) => <Icon {...p}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></Icon>;
        const ArrowRightIcon = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></Icon>;
        const RefreshIcon = (p) => <Icon {...p}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></Icon>;

        // --- COMPONENTES UI GENÉRICOS ---

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false }) => {
            const baseClass = "px-6 py-3 rounded-xl font-bold transition-all transform hover:scale-105 shadow-lg flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-gradient-to-r from-infi-blue to-blue-600 text-white hover:shadow-blue-500/30",
                secondary: "bg-white text-infi-blue border-2 border-infi-blue hover:bg-blue-50",
                success: "bg-gradient-to-r from-green-500 to-emerald-600 text-white hover:shadow-green-500/30",
                warning: "bg-infi-yellow text-gray-900 hover:shadow-yellow-500/30",
                danger: "bg-red-500 text-white hover:bg-red-600"
            };
            return <button onClick={onClick} disabled={disabled} className={`${baseClass} ${variants[variant]} ${className}`}>{children}</button>;
        };

        const Modal = ({ isOpen, type, message, onNext }) => {
            if (!isOpen) return null;
            const isSuccess = type === 'success';

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm fade-in p-4">
                    <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl border-4 border-white bounce-in relative overflow-hidden">
                        <div className={`absolute top-0 left-0 w-full h-2 ${isSuccess ? 'bg-green-500' : 'bg-red-500'}`}></div>
                        <div className="mb-4 flex justify-center">
                            {isSuccess ?
                                <div className="p-4 bg-green-100 rounded-full text-green-600"><CheckIcon size={48} /></div> :
                                <div className="p-4 bg-red-100 rounded-full text-red-600"><XIcon size={48} /></div>
                            }
                        </div>
                        <h3 className="text-2xl font-bold mb-2 text-gray-800">{isSuccess ? '¡Excelente!' : 'Inténtalo de nuevo'}</h3>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <Button onClick={onNext} variant={isSuccess ? 'success' : 'primary'} className="w-full">
                            {isSuccess ? 'Continuar' : 'Reintentar'}
                        </Button>
                    </div>
                </div>
            );
        };

        // --- MÓDULO DE TEORÍA (Nuevo) ---
        const ModuleTheory = ({ onComplete }) => {
            const [slide, setSlide] = useState(0);
            const slides = [
                {
                    title: "¿Qué es INFIBAGUÉ?",
                    icon: BookIcon,
                    content: (
                        <div className="space-y-4 text-left">
                            <p className="text-gray-700 leading-relaxed">
                                El <span className="font-bold text-infi-blue">Instituto de Financiamiento, Promoción y Desarrollo de Ibagué – INFIBAGUÉ</span>, es un establecimiento público del orden municipal.
                            </p>
                            <ul className="list-disc pl-5 space-y-2 text-gray-600">
                                <li>Dotado de personería jurídica.</li>
                                <li>Autonomía administrativa y presupuestal.</li>
                                <li>Patrimonio propio e independiente.</li>
                            </ul>
                            <div className="bg-blue-50 p-4 rounded-lg border-l-4 border-infi-blue mt-4">
                                <p className="text-sm text-infi-blue font-semibold">Marco Legal</p>
                                <p className="text-xs text-gray-600">Se rige por la Constitución Política, la Ley 489 de 1998, Decreto 0183 de 2001 y sus modificaciones.</p>
                            </div>
                        </div>
                    )
                },
                {
                    title: "Misión",
                    icon: TargetIcon,
                    content: (
                        <div className="space-y-4 text-center">
                            <div className="bg-gray-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 text-infi-blue">
                                <ActivityIcon size={40} />
                            </div>
                            <p className="text-gray-700 text-lg font-medium">
                                "Ser generador de desarrollo para la comunidad Ibaguereña."
                            </p>
                            <p className="text-gray-600 text-sm">
                                Mediante la oferta de productos financieros, creación de esquemas empresariales y prestación eficaz de servicios públicos con compromiso social.
                            </p>
                        </div>
                    )
                },
                {
                    title: "Visión 2025",
                    icon: EyeIcon,
                    content: (
                        <div className="space-y-4 text-center">
                            <div className="bg-gray-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 text-infi-green">
                                <EyeIcon size={40} />
                            </div>
                            <p className="text-gray-700 text-lg font-medium">
                                "Núcleo de excelencia de la Administración Municipal."
                            </p>
                            <p className="text-gray-600 text-sm">
                                Generador y Promotor de esquemas empresariales para el desarrollo social, económico y ambiental del Municipio de Ibagué.
                            </p>
                        </div>
                    )
                }
            ];

            return (
                <div className="flex flex-col items-center w-full max-w-3xl mx-auto text-center h-full justify-center">
                    <div className="mb-6 flex space-x-2">
                        {slides.map((_, i) => (
                            <div key={i} className={`h-2 w-8 rounded-full transition-colors ${i === slide ? 'bg-infi-blue' : 'bg-gray-200'}`} />
                        ))}
                    </div>

                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full relative overflow-hidden min-h-[400px] flex flex-col slide-left">
                        <div className="absolute top-0 right-0 p-6 opacity-5">
                            {React.createElement(slides[slide].icon, { size: 150, className: "text-infi-blue" })}
                        </div>

                        <h2 className="text-3xl font-bold text-infi-blue mb-8 flex items-center justify-center gap-3">
                            {React.createElement(slides[slide].icon, { size: 32 })}
                            {slides[slide].title}
                        </h2>

                        <div className="flex-1 flex flex-col justify-center relative z-10">
                            {slides[slide].content}
                        </div>

                        <div className="mt-8 flex justify-end">
                            {slide < slides.length - 1 ? (
                                <Button onClick={() => setSlide(s => s + 1)}>
                                    Siguiente <ArrowRightIcon size={20} />
                                </Button>
                            ) : (
                                <Button variant="success" onClick={() => onComplete(100)}>
                                    Ir a los Juegos <PlayIcon size={20} />
                                </Button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MÓDULO DE EVALUACIÓN (Integrado con progress.js) ---
        const ModuleEvaluation = ({ onComplete }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [finished, setFinished] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isCorrect, setIsCorrect] = useState(null);
            const [markedAsDone, setMarkedAsDone] = useState(false);

            const questions = [
                {
                    q: "¿Cuál es la misión principal de Infibagué?",
                    options: [
                        "Proporcionar servicios de alumbrado público y limpieza",
                        "Ser generadora de desarrollo para la comunidad Ibaguereña",
                        "Gestionar los parques y zonas verdes",
                        "Administrar las plazas de mercado"
                    ],
                    correct: 1
                },
                {
                    q: "¿Cuáles son los valores del Código de Integridad?",
                    options: [
                        "Honestidad, Respeto, Justicia, Diligencia y Compromiso",
                        "Responsabilidad, Puntualidad y Respeto",
                        "Solidaridad, Amor y Paz",
                        "Eficacia, Eficiencia y Economía"
                    ],
                    correct: 0
                },
                {
                    q: "Mencione alguna de las funciones de Infibagué:",
                    options: [
                        "Prestación de Servicios Financieros y de Garantía",
                        "Recolección de basuras",
                        "Vigilancia de tránsito",
                        "Educación escolar"
                    ],
                    correct: 0
                },
                {
                    q: "¿Cuáles son las Actividades Transitorias (Decreto 183 de 2001)?",
                    options: [
                        "Alumbrado Público, Plazas de Mercado, Parques y Zonas Verdes",
                        "Transporte masivo y terminales",
                        "Salud y saneamiento",
                        "Cultura y deporte"
                    ],
                    correct: 0
                },
                {
                    q: "Según el Mapa de Procesos, los procesos son:",
                    options: [
                        "Estratégicos, Misionales, Evaluación y Apoyo",
                        "Gerenciales, Operativos y Financieros",
                        "Internos y Externos",
                        "Primarios y Secundarios"
                    ],
                    correct: 0
                },
                {
                    q: "Planes que maneja la Oficina de Gestión Humana:",
                    options: [
                        "Plan de Bienestar, Capacitación, Estímulos e Incentivos",
                        "Plan de Desarrollo Municipal",
                        "Plan de Ordenamiento Territorial",
                        "Plan de Compras"
                    ],
                    correct: 0
                },
                {
                    q: "Indica las cuatro Direcciones que componen la estructura:",
                    options: [
                        "Dir. Proyectos",
                        "Dir. Servicios Administrativos",
                        "Dir. Financiera",
                        "Todas las anteriores (incluye Operativa y Comercial)"
                    ],
                    correct: 3
                }
            ];

            const handleAnswer = (index) => {
                if (selectedOption !== null) return;
                setSelectedOption(index);

                const correct = index === questions[currentQ].correct;
                setIsCorrect(correct);
                if (correct) setScore(s => s + 1);

                setTimeout(() => {
                    if (currentQ < questions.length - 1) {
                        setCurrentQ(prev => prev + 1);
                        setSelectedOption(null);
                        setIsCorrect(null);
                    } else {
                        setFinished(true);
                    }
                }, 1500);
            };

            const percentage = Math.round((score / questions.length) * 100);
            const passed = percentage > 90;

            // Función para marcar como hecho y guardar progreso
            const handleMarkAsDone = async () => {
                // 1. Guardar en Supabase
                if (typeof guardarProgreso === 'function') {
                    await guardarProgreso('gestion_humana', percentage, passed);
                } else {
                    console.warn("guardarProgreso no disponible");
                }

                // 2. Notificar al padre (induccion-curso.html)
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'MODULO_INDUCCION_COMPLETADO',
                        data: {
                            moduleId: 'humana', // Clave usada en MODULOS_INDUCCION
                            moduleName: 'Gestión Humana',
                            aprobado: passed,
                            score: score,
                            total: questions.length,
                            percentage: percentage,
                            fecha: new Date().toISOString(),
                            autoAdvance: false // Evitar navegación automática para que el usuario use el botón
                        }
                    }, '*');
                }

                setMarkedAsDone(true);
            };

            // Función para reintentar la evaluación
            const handleRetry = async () => {
                // Incrementar intentos en el sistema de progreso
                if (typeof incrementAttempts === 'function') {
                    await incrementAttempts('gestion_humana');
                }
                setCurrentQ(0);
                setScore(0);
                setFinished(false);
                setSelectedOption(null);
                setIsCorrect(null);
                setMarkedAsDone(false);
            };

            if (finished) {
                return (
                    <div className="w-full max-w-2xl mx-auto text-center bounce-in">
                        <div className="bg-white p-10 rounded-3xl shadow-2xl relative overflow-hidden">
                            {passed ? (
                                <>
                                    <div className={`absolute top-0 left-0 w-full h-4 ${markedAsDone ? 'bg-gradient-to-r from-green-400 via-emerald-500 to-teal-500' : 'bg-green-500'}`}></div>
                                    <div className={`mb-6 inline-block p-4 rounded-full transition-all duration-500 ${markedAsDone ? 'bg-emerald-100 text-emerald-600 scale-110' : 'bg-green-100 text-green-600'}`}>
                                        {markedAsDone ? <CheckIcon size={64} /> : <TrophyIcon size={64} />}
                                    </div>
                                    <h2 className="text-3xl font-bold text-gray-800 mb-2">
                                        {markedAsDone ? '✅ ¡Módulo Completado!' : '¡Felicitaciones!'}
                                    </h2>
                                    <p className="text-gray-600 mb-4">
                                        {markedAsDone
                                            ? 'Has completado exitosamente el módulo de Gestión Humana. Tu progreso ha sido guardado.'
                                            : 'Has aprobado la evaluación de Gestión Humana.'}
                                    </p>
                                    <div className={`text-5xl font-black mb-4 transition-colors duration-500 ${markedAsDone ? 'text-emerald-600' : 'text-infi-blue'}`}>{percentage}%</div>

                                    {markedAsDone ? (
                                        <div className="fade-in">
                                            {/* Confirmación visual de completado */}
                                            <div className="bg-gradient-to-r from-emerald-50 to-teal-50 border-2 border-emerald-200 rounded-2xl p-5 mb-6 relative overflow-hidden">
                                                <div className="absolute top-0 right-0 opacity-10">
                                                    <CheckIcon size={80} className="text-emerald-500" />
                                                </div>
                                                <div className="flex items-center justify-center gap-3 mb-2">
                                                    <div className="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
                                                    <span className="text-emerald-700 font-bold text-lg">Progreso Guardado</span>
                                                </div>
                                                <p className="text-emerald-600 text-sm">
                                                    Módulo de Gestión Humana marcado como completado en tu perfil.
                                                </p>
                                            </div>

                                            <Button onClick={() => {
                                                console.log('Navegando a Gestión Ambiental...');
                                                // Intentar notificar al padre para actualizar sidebar/progreso
                                                if (window.parent !== window) {
                                                    window.parent.postMessage({ type: 'REQUEST_NAVIGATION', targetModule: 'ambiental' }, '*');
                                                }
                                                // Navegación directa para asegurar que el usuario avance
                                                window.location.href = 'induccion-gestion-ambiental.html';
                                            }} variant="primary" className="w-full text-lg mb-4">
                                                Ir a Gestión Ambiental 🌳 <ArrowRightIcon />
                                            </Button>

                                            <div className="mt-4">
                                                <button onClick={() => window.location.href = 'index.html'} className="text-sm text-gray-400 hover:text-infi-blue underline transition-colors">
                                                    Volver al panel de módulos
                                                </button>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <p className="text-gray-500 text-sm mb-6">Marca como hecho para guardar tu progreso y desbloquear el siguiente módulo.</p>

                                            <button
                                                onClick={handleMarkAsDone}
                                                className="w-full py-4 px-6 rounded-2xl font-bold text-lg transition-all transform hover:scale-[1.02] active:scale-95 shadow-xl flex items-center justify-center gap-3 bg-gradient-to-r from-emerald-500 via-green-500 to-teal-500 text-white hover:shadow-green-500/40 hover:shadow-2xl border-b-4 border-emerald-700"
                                                id="btn-marcar-hecho"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                                    <polyline points="20 6 9 17 4 12"></polyline>
                                                </svg>
                                                Marcar como Hecho
                                            </button>

                                            <div className="mt-4">
                                                <button onClick={() => window.location.href = 'index.html'} className="text-sm text-gray-400 hover:text-infi-blue underline transition-colors">
                                                    Volver al panel de módulos
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </>
                            ) : (
                                <>
                                    <div className="absolute top-0 left-0 w-full h-4 bg-red-500"></div>
                                    <div className="mb-6 inline-block p-4 bg-red-100 text-red-600 rounded-full">
                                        <RefreshIcon size={64} />
                                    </div>
                                    <h2 className="text-3xl font-bold text-gray-800 mb-2">Inténtalo de nuevo</h2>
                                    <p className="text-gray-600 mb-2">Necesitas más del 90% para aprobar y avanzar al módulo de Gestión Ambiental.</p>
                                    <div className={`text-5xl font-black ${percentage > 90 ? 'text-green-500' : 'text-red-500'} mb-4`}>{percentage}%</div>

                                    <div className="bg-red-50 border border-red-200 rounded-xl p-4 mb-6">
                                        <p className="text-red-700 text-sm font-medium">⚠️ Debes obtener un puntaje superior al 90% para aprobar.</p>
                                    </div>

                                    <Button onClick={handleRetry} variant="primary" className="w-full">
                                        Repetir Evaluación <RefreshIcon />

                            </div>
                        </div>

                        {/* Evaluación */}
                        <div onClick={() => handleZoneClick('evaluation')}
                            className="min-h-[140px] border-2 border-dashed border-blue-400 bg-blue-50/50 rounded-2xl p-4 cursor-pointer relative hover:scale-[1.01] transition-transform">
                            <div className="absolute -top-3 left-4 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest text-blue-700 bg-white border border-blue-200 shadow-sm">
                                Evaluación
                            </div>
                            <div className="flex flex-wrap gap-2 mt-2">
                                {placedItems.evaluation.map(item => (
                                    <div key={item.id} className={`${item.color} text-white px-2 py-1 rounded text-[10px] font-bold shadow-sm fade-in`}>
                                        {item.text}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Área de Selección */}
                    <div className="bg-white rounded-[2rem] p-6 shadow-xl border border-slate-100 relative overflow-hidden w-full">
                        {finished ? (
                            <div className="flex flex-col items-center py-4 animate-bounce">
                                <div className="bg-yellow-400 p-3 rounded-full mb-2 shadow-lg text-white">
                                    <TrophyIcon size={32} />
                                </div>
                                <h2 className="text-2xl font-black text-[#003366] mb-1">¡Misión Cumplida!</h2>
                                <p className="text-slate-600 mb-0">Has organizado correctamente el Mapa de Procesos.</p>
                            </div>
                        ) : (
                            <>
                                <h3 className="text-center text-slate-400 font-bold text-[10px] uppercase tracking-[0.3em] mb-4">
                                    Procesos Disponibles
                                </h3>

                                <div className="flex flex-wrap justify-center gap-2">
                                    {items.map(item => (
                                        <button
                                            key={item.id}
                                            onClick={(e) => { e.stopPropagation(); handleItemSelect(item); }}
                                            className={`px-4 py-2 rounded-xl font-bold transition-all duration-200 text-xs shadow-sm border 
                                                ${selected?.id === item.id
                                                    ? 'bg-slate-800 text-white border-slate-800 scale-105 ring-2 ring-slate-300'
                                                    : 'bg-white text-slate-700 border-slate-200 hover:shadow-md hover:-translate-y-1'}`}
                                        >
                                            {item.text}
                                        </button>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        const App = () => {
            const [gameState, setGameState] = useState('intro');
            const [currentModule, setCurrentModule] = useState(0);
            const [scores, setScores] = useState([0, 0, 0, 0, 0, 0, 0]);
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [isLoading, setIsLoading] = useState(true);

            // Validar acceso al módulo al cargar
            useEffect(() => {
                const initModule = async () => {
                    try {
                        console.log('🔄 Iniciando Gestión Humana...');

                        // 1. Validar Acceso
                        let accessible = true;
                        if (window.SupabaseProgress && window.SupabaseProgress.validateModuleAccess) {
                            accessible = await window.SupabaseProgress.validateModuleAccess('gestion_humana');
                        } else if (typeof validateModuleAccess === 'function') {
                            accessible = await validateModuleAccess('gestion_humana');
                        }

                        if (!accessible) {
                            console.warn('⛔ Acceso denegado, redirigiendo...');
                            return; // validateModuleAccess maneja la redirección
                        }

                        // 2. Iniciar Módulo (Marcar como visto/en progreso)
                        if (window.SupabaseProgress && window.SupabaseProgress.startModule) {
                            await window.SupabaseProgress.startModule('gestion_humana');
                        } else if (typeof startModule === 'function') {
                            await startModule('gestion_humana');
                        }

                        console.log('✅ Módulo iniciado correctamente');
                    } catch (error) {
                        console.error('❌ Error fatal inicializando módulo:', error);
                        // En caso de error crítico, permitimos cargar para no bloquear al usuario,
                        // pero mostramos advertencia en consola.
                    } finally {
                        setIsLoading(false);
                    }
                };

                initModule();
            }, []);

            const modules = [
                { id: 0, title: "Teoría Institucional", component: ModuleTheory, icon: BookIcon },
                { id: 1, title: "Accionistas", component: GameShareholders, icon: UsersIcon },
                { id: 2, title: "Líneas de Proyecto", component: GameProjects, icon: LayersIcon },
                { id: 3, title: "Estructura Org.", component: GameStructure, icon: ActivityIcon },
                { id: 4, title: "Valores", component: GameValues, icon: StarIcon },
                { id: 5, title: "Mapa de Procesos", component: GameProcessPuzzle, icon: PuzzleIcon },
                { id: 6, title: "Evaluación Final", component: ModuleEvaluation, icon: ClipboardCheckIcon }
            ];

            const handleModuleComplete = async (score) => {
                const newScores = [...scores];
                newScores[currentModule] = score;
                setScores(newScores);

                // Guardar paso actual en progreso
                if (typeof saveCurrentStep === 'function') {
                    // No necesitamos esperar esto bloqueando la UI, puede ir en background
                    saveCurrentStep('gestion_humana', currentModule, modules[currentModule].title);
                }

                // Si es la evaluación final, el componente maneja todo internamente
                if (modules[currentModule].title === "Evaluación Final") {
                    return;
                }

                setShowSuccessModal(true);
            };

            const nextModule = () => {
                setShowSuccessModal(false);
                if (currentModule < modules.length - 1) {
                    setCurrentModule(prev => prev + 1);
                } else {
                    setGameState('results'); // Not reachable normally due to new final evaluation logic
                }
            };

            const CurrentGame = modules[currentModule].component;
            const CurrentIcon = modules[currentModule].icon;

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-infi-blue"></div>
                    </div>
                );
            }

            if (gameState === 'intro') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50 flex flex-col items-center justify-center p-4">
                        <div className="bg-white rounded-[2.5rem] shadow-2xl p-8 md:p-12 max-w-4xl w-full text-center relative overflow-hidden fade-in border border-white/50">
                            <div className="mb-8 flex justify-center relative z-10">
                                <div className="bg-gradient-to-r from-infi-blue to-blue-700 text-white p-6 rounded-2xl shadow-xl transform rotate-3 hover:rotate-0 transition-transform duration-500">
                                    <h1 className="text-4xl font-black tracking-widest">INFIBAGUÉ</h1>
                                    <p className="text-[10px] tracking-[0.2em] opacity-80 mt-1">INSTITUTO DE FINANCIAMIENTO</p>
                                </div>
                            </div>
                            <h2 className="text-3xl md:text-5xl font-black text-gray-800 mb-4 tracking-tight relative z-10">Inducción Gestión Humana</h2>
                            <p className="text-lg text-gray-600 mb-10 max-w-2xl mx-auto leading-relaxed relative z-10">
                                Bienvenido. Este módulo interactivo te guiará por nuestra teoría, estructura y valores, finalizando con una evaluación certificable.
                            </p>
                            <Button onClick={() => setGameState('playing')} className="mx-auto text-lg w-full md:w-auto relative z-10">Iniciar Recorrido <PlayIcon size={20} /></Button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-sans">
                    <header className="bg-white shadow-sm sticky top-0 z-30 border-b border-gray-100">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-infi-blue rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-md">IB</div>
                                <h1 className="font-bold text-gray-800 hidden md:block tracking-tight">Inducción Institucional</h1>
                            </div>
                            <div className="flex-1 max-w-md mx-4 md:mx-12">
                                <div className="flex justify-between text-[10px] uppercase font-bold text-gray-400 mb-1 tracking-wider"><span>Progreso</span><span>{currentModule + 1} / {modules.length}</span></div>
                                <div className="h-2 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-infi-blue to-blue-400 transition-all duration-500 ease-out" style={{ width: `${((currentModule) / modules.length) * 100}%` }}></div></div>
                            </div>
                            <div className="text-sm font-bold text-infi-blue bg-blue-50 border border-blue-100 px-4 py-1.5 rounded-full shadow-sm flex items-center gap-2"><span className="hidden md:inline">{modules[currentModule].title}</span><CurrentIcon size={16} /></div>
                        </div>
                    </header>
                    <main className="flex-1 p-4 md:p-6 flex items-center justify-center relative">
                        <div className="absolute top-10 left-10 w-32 h-32 bg-infi-blue/5 rounded-full blur-2xl"></div>
                        <div className="absolute bottom-10 right-10 w-40 h-40 bg-infi-green/5 rounded-full blur-2xl"></div>
                        <div className="w-full max-w-5xl glass-panel rounded-[2rem] p-4 md:p-8 fade-in min-h-[60vh] flex flex-col justify-center relative z-10">
                            <CurrentGame onComplete={handleModuleComplete} />
                        </div>
                    </main>
                    <Modal isOpen={showSuccessModal} type="success" message={`Has completado: ${modules[currentModule].title}`} onNext={nextModule} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
